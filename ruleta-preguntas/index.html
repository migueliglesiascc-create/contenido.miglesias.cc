/* ===== CLASES DE BOLSILLO · NEON GAME UI V5 ===== */
body{
  background:
    radial-gradient(circle at 18% 10%,rgba(168,85,247,.30),transparent 30%),
    radial-gradient(circle at 82% 16%,rgba(14,165,233,.24),transparent 28%),
    radial-gradient(circle at 50% 100%,rgba(236,72,153,.18),transparent 34%),
    linear-gradient(135deg,#020617,#060818 48%,#0b1026);
  color:#f8fafc;
}
.app{
  max-width:1180px;
  background:rgba(5,10,28,.92);
  border:1px solid rgba(168,85,247,.45);
  box-shadow:0 0 0 1px rgba(14,165,233,.12),0 28px 80px rgba(0,0,0,.42),0 0 45px rgba(168,85,247,.22);
}
.app:before{
  width:340px;height:340px;
  background:radial-gradient(circle,rgba(34,211,238,.18),transparent 62%);
  right:-130px;top:-130px;
}
.home-button,.secondary{
  background:rgba(15,23,42,.78);
  color:#f8fafc;
  border:1px solid rgba(168,85,247,.65);
  box-shadow:0 0 16px rgba(168,85,247,.16);
}
.home-button:hover,.secondary:hover{background:rgba(30,41,59,.9)}
.logo{box-shadow:0 0 24px rgba(34,211,238,.42);border:2px solid rgba(34,211,238,.35)}
h1{
  color:#fff;
  font-size:2.1rem;
  text-shadow:0 0 24px rgba(34,211,238,.25);
}
.subtitle{
  color:#67e8f9;
  font-weight:800;
  font-style:italic;
}
.layout{grid-template-columns:.88fr 1.12fr;gap:16px}
.panel,.stage{
  background:linear-gradient(180deg,rgba(10,18,42,.92),rgba(5,10,28,.94));
  border:1px solid rgba(99,102,241,.45);
  box-shadow:0 18px 45px rgba(0,0,0,.28), inset 0 0 0 1px rgba(34,211,238,.08);
}
.panel-title{
  color:#22d3ee;
  font-size:1.05rem;
  letter-spacing:.02em;
}
input,select,textarea{
  background:rgba(248,250,252,.96);
  border:2px solid rgba(125,211,252,.55);
}
.primary{
  background:linear-gradient(135deg,#ec4899,#7c3aed 48%,#2563eb);
  box-shadow:0 16px 34px rgba(124,58,237,.34),0 0 20px rgba(236,72,153,.18);
}
.magic{
  background:linear-gradient(135deg,#ec4899,#7c3aed);
  color:#fff;
  border:1px solid rgba(255,255,255,.18);
}
.danger{background:linear-gradient(135deg,#991b1b,#ef4444);color:white}
.db-status{
  background:rgba(8,47,73,.8)!important;
  color:#bae6fd!important;
  border:1px solid rgba(34,211,238,.35);
}
.question-item{
  background:rgba(15,23,42,.82)!important;
  border-color:rgba(99,102,241,.45)!important;
}
.question-item input{background:rgba(2,6,23,.8)!important;color:#f8fafc!important}
.stage{position:relative;overflow:hidden}
.stage:before{
  content:"";
  position:absolute;inset:10px;
  border-radius:24px;
  border:1px solid rgba(168,85,247,.28);
  box-shadow:inset 0 0 42px rgba(168,85,247,.12);
  pointer-events:none;
}

.result-box{
  background:linear-gradient(180deg,rgba(15,23,42,.92),rgba(2,6,23,.96));
  border:2px solid rgba(99,102,241,.85);
  box-shadow:0 0 30px rgba(124,58,237,.22);
}
.result-label{
  display:inline-flex;
  align-self:center;
  background:linear-gradient(135deg,#ec4899,#7c3aed);
  color:white;
  padding:7px 22px;
  border-radius:999px;
  margin-bottom:12px;
}
.result-question{color:#fff;font-size:1.45rem;text-shadow:0 0 16px rgba(255,255,255,.1)}
.wheel{
  box-shadow:0 20px 46px rgba(0,0,0,.38),0 0 34px rgba(34,211,238,.22),inset 0 0 0 3px #0f172a;
}
.wheel-legend{
  background:rgba(15,23,42,.72);
  border-color:rgba(34,211,238,.35);
}
.legend-item{color:#f8fafc}.legend-number{color:#67e8f9}

<script id="charlix-activity-combo-script">
(function(){
  function setupActivityCombo(){
    const combo=document.getElementById('activityCombo');
    const input=document.getElementById('suggestionCategory');
    const toggle=document.getElementById('activityToggleBtn');
    const menu=document.getElementById('activityMenu');
    if(!combo||!input||!toggle||!menu)return;

    function openMenu(){menu.classList.add('open')}
    function closeMenu(){menu.classList.remove('open')}
    function toggleMenu(){menu.classList.toggle('open')}

    toggle.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();toggleMenu();input.focus()});
    input.addEventListener('focus',openMenu);
    input.addEventListener('click',openMenu);
    input.addEventListener('keydown',function(e){
      if(e.key==='Escape')closeMenu();
      if(e.key==='ArrowDown'){
        e.preventDefault();
        openMenu();
        const first=menu.querySelector('button');
        if(first)first.focus();
      }
    });
    menu.querySelectorAll('button[data-value]').forEach(function(btn){
      btn.addEventListener('click',function(){
        input.value=btn.dataset.value||btn.textContent.trim();
        closeMenu();
        input.focus();
      });
    });
    menu.addEventListener('keydown',function(e){
      const buttons=[...menu.querySelectorAll('button')];
      const index=buttons.indexOf(document.activeElement);
      if(e.key==='Escape'){closeMenu();input.focus()}
      if(e.key==='ArrowDown'){
        e.preventDefault();
        buttons[Math.min(index+1,buttons.length-1)]?.focus();
      }
      if(e.key==='ArrowUp'){
        e.preventDefault();
        if(index<=0)input.focus();
        else buttons[index-1]?.focus();
      }
    });
    document.addEventListener('click',function(e){if(!combo.contains(e.target))closeMenu()});
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setupActivityCombo);
  else setupActivityCombo();
})();
</script>

<script id="charlix-projector-fullscreen-script">
(function(){
  function isProjectorMode(){return document.body.classList.contains('projector-mode')}

  function refreshProjectorWheel(){
    if(typeof renderWheel==='function')setTimeout(renderWheel,30);
  }

  function resetProjectorPendingQuestion(){
    try{
      selectedQuestion=null;
      selectedQuestionIndex=-1;
    }catch(e){}
    const result=document.getElementById('resultQuestion');
    if(result)result.textContent='---';
    document.body.classList.remove('projector-result-open');
  }

  function enterProjectorMode(){
    resetProjectorPendingQuestion();
    document.body.classList.add('projector-mode');
    refreshProjectorWheel();
    const target=document.documentElement;
    if(target.requestFullscreen)target.requestFullscreen().catch(function(){});
  }

  function exitProjectorMode(){
    document.body.classList.remove('projector-mode');
    refreshProjectorWheel();
    if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(function(){});
  }

  const previousTextWidth=window.getWheelTextWidth;
  window.getWheelTextWidth=function(total){
    const wheelEl=document.getElementById('wheel');
    if(isProjectorMode()&&wheelEl){
      const d=wheelEl.clientWidth||620;
      if(total<=4)return Math.round(d*.30)+'px';
      if(total<=6)return Math.round(d*.25)+'px';
      if(total<=8)return Math.round(d*.21)+'px';
      return Math.round(d*.16)+'px';
    }
    return typeof previousTextWidth==='function'?previousTextWidth(total):'96px';
  };

  const previousLabelRadius=window.getWheelLabelRadius;
  window.getWheelLabelRadius=function(total){
    const wheelEl=document.getElementById('wheel');
    if(isProjectorMode()&&wheelEl){
      const d=wheelEl.clientWidth||620;
      if(total<=4)return Math.round(d*.285);
      if(total<=6)return Math.round(d*.305);
      if(total<=8)return Math.round(d*.318);
      return Math.round(d*.295);
    }
    return typeof previousLabelRadius==='function'?previousLabelRadius(total):90;
  };

  function setupProjectorMode(){
    document.getElementById('projectorOpenBtn')?.addEventListener('click',enterProjectorMode);
    document.getElementById('projectorCloseBtn')?.addEventListener('click',exitProjectorMode);
    document.getElementById('projectorTextMinusBtn')?.addEventListener('click',function(){if(typeof adjustWheelTextSize==='function')adjustWheelTextSize(-0.06)});
    document.getElementById('projectorTextPlusBtn')?.addEventListener('click',function(){if(typeof adjustWheelTextSize==='function')adjustWheelTextSize(0.06)});
    document.addEventListener('keydown',function(e){if(e.key==='Escape'&&isProjectorMode())exitProjectorMode()});
    document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement&&isProjectorMode()){document.body.classList.remove('projector-mode');refreshProjectorWheel()}});
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setupProjectorMode);
  else setupProjectorMode();
})();
</script>

<script id="charlix-projector-modal-result-script-v25">
(function(){
  function isProjectorMode(){return document.body.classList.contains('projector-mode')}

  function isRealSelectedQuestion(text){
    const value=String(text||'').trim();
    if(!value)return false;
    return !['---','Girando...','No hay preguntas disponibles','Pregunta quitada temporalmente','Preguntas generadas','Set guardado','Set borrado'].some(function(marker){return value.indexOf(marker)===0});
  }

  function closeProjectorModal(){
    document.body.classList.remove('projector-result-open');
  }

  function syncProjectorModal(){
    const result=document.getElementById('resultQuestion');
    if(!result||!isProjectorMode()){
      closeProjectorModal();
      return;
    }
    document.body.classList.toggle('projector-result-open',isRealSelectedQuestion(result.textContent));
  }

  function setupProjectorModal(){
    const result=document.getElementById('resultQuestion');
    if(result){
      new MutationObserver(syncProjectorModal).observe(result,{childList:true,characterData:true,subtree:true});
    }
    document.getElementById('spinBtn')?.addEventListener('click',closeProjectorModal,true);
    document.getElementById('keepQuestionBtn')?.addEventListener('click',function(){setTimeout(closeProjectorModal,0)},true);
    document.getElementById('removeQuestionBtn')?.addEventListener('click',function(){setTimeout(closeProjectorModal,0)},true);
    document.getElementById('projectorOpenBtn')?.addEventListener('click',function(){setTimeout(closeProjectorModal,80)});
    document.getElementById('projectorCloseBtn')?.addEventListener('click',closeProjectorModal);
    document.addEventListener('keydown',function(e){if(e.key==='Escape')closeProjectorModal()});
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setupProjectorModal);
  else setupProjectorModal();
})();
</script>
<script id="charlix-projector-text-size-boost-v27">
(function(){
  const NORMAL_MAX=1.05;
  const PROJECTOR_MAX=1.45;
  const MIN_SIZE=.42;
  const previousAdjustWheelTextSize=window.adjustWheelTextSize;

  function inProjectorMode(){
    return document.body.classList.contains('projector-mode');
  }

  function saveAndRefresh(){
    localStorage.setItem('questionWheelTextSize',String(wheelTextSize));
    if(typeof updateWheelTextSizeLabel==='function')updateWheelTextSizeLabel();
    if(typeof renderWheel==='function')renderWheel();
  }

  window.adjustWheelTextSize=function(delta){
    if(inProjectorMode()){
      wheelTextSize=Math.max(MIN_SIZE,Math.min(PROJECTOR_MAX,Number((wheelTextSize+delta).toFixed(2))));
      saveAndRefresh();
      return;
    }
    if(typeof previousAdjustWheelTextSize==='function'){
      previousAdjustWheelTextSize(delta);
      return;
    }
    wheelTextSize=Math.max(MIN_SIZE,Math.min(NORMAL_MAX,Number((wheelTextSize+delta).toFixed(2))));
    saveAndRefresh();
  };

  function clampNormalTextSize(){
    if(inProjectorMode())return;
    if(typeof wheelTextSize==='number'&&wheelTextSize>NORMAL_MAX){
      wheelTextSize=NORMAL_MAX;
      saveAndRefresh();
    }
  }

  document.getElementById('projectorCloseBtn')?.addEventListener('click',function(){setTimeout(clampNormalTextSize,120)});
  document.addEventListener('fullscreenchange',function(){setTimeout(clampNormalTextSize,120)});
})();
</script>

<script id="charlix-roulette-projector-controls-v31">
(function(){
  const MIN_SIZE=42;
  const MAX_SIZE=145;

  function getStage(){
    return document.querySelector('.stage');
  }

  function getSlider(){
    return document.getElementById('projectorTextSizeRange');
  }

  function getValue(){
    return document.getElementById('projectorTextSizeValue');
  }

  function isProjectorMode(){
    return document.body.classList.contains('projector-mode');
  }

  function ensureProjectorControls(){
    const stage=getStage();
    if(!stage || document.getElementById('projectorTextSizeRange')) return;

    const rail=document.createElement('div');
    rail.className='projector-size-rail';
    rail.innerHTML='<label for="projectorTextSizeRange">Tama&ntilde;o</label><input id="projectorTextSizeRange" type="range" min="'+MIN_SIZE+'" max="'+MAX_SIZE+'" step="3" value="100"><span id="projectorTextSizeValue" class="projector-size-value">100%</span>';
    stage.appendChild(rail);

    rail.querySelector('input').addEventListener('input',function(){
      const next=Number(this.value)/100;
      if(typeof wheelTextSize==='number'){
        wheelTextSize=Number(next.toFixed(2));
        localStorage.setItem('questionWheelTextSize',String(wheelTextSize));
      }
      syncProjectorSlider();
      if(typeof updateWheelTextSizeLabel==='function')updateWheelTextSizeLabel();
      if(typeof renderWheel==='function')renderWheel();
    });
  }

  function syncProjectorSlider(){
    const slider=getSlider();
    const value=getValue();
    if(!slider) return;
    const percent=Math.round((typeof wheelTextSize==='number'?wheelTextSize:1)*100);
    const clamped=Math.max(MIN_SIZE,Math.min(MAX_SIZE,percent));
    slider.value=String(clamped);
    if(value) value.textContent=clamped+'%';
  }

  function onProjectorRefresh(){
    ensureProjectorControls();
    syncProjectorSlider();
  }

  document.getElementById('projectorOpenBtn')?.addEventListener('click',function(){
    setTimeout(onProjectorRefresh,80);
  });
  document.getElementById('projectorCloseBtn')?.addEventListener('click',function(){
    document.body.classList.remove('projector-result-open');
  });
  document.addEventListener('fullscreenchange',function(){
    setTimeout(function(){
      if(isProjectorMode()) onProjectorRefresh();
    },80);
  });
  document.addEventListener('DOMContentLoaded',onProjectorRefresh);
  onProjectorRefresh();
})();
</script>
</body></html>
