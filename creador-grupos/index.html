<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creador de Grupos | Miguel Iglesias</title>
  <link rel="icon" href="./logo.png" />
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="apple-touch-icon" href="../favicon.png">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(14, 165, 233, 0.22), transparent 35%),
        radial-gradient(circle at bottom right, rgba(79, 70, 229, 0.18), transparent 35%),
        linear-gradient(135deg, #f8fafc, #e0f2fe);
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 10px;
      transition: background 0.35s ease, color 0.35s ease;
    }

    body.dark-mode {
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(99, 102, 241, 0.16), transparent 35%),
        linear-gradient(135deg, #020617, #0f172a);
      color: #e5e7eb;
    }

    .app {
      width: 100%;
      max-width: 920px;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.14);
      border: 1px solid rgba(14, 165, 233, 0.25);
      overflow: hidden;
      position: relative;
      transition: background 0.35s ease, border 0.35s ease, box-shadow 0.35s ease;
    }

    .dark-mode .app {
      background: rgba(15, 23, 42, 0.96);
      border-color: rgba(56, 189, 248, 0.25);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }

    .app::before {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: rgba(14, 165, 233, 0.08);
      right: -90px;
      top: -90px;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .home-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      background: #dbeafe;
      color: #075985;
      border: 1px solid #93c5fd;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.92rem;
      margin-bottom: 16px;
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
      transition: transform .15s ease, background .15s ease;
    }

    .home-button:hover {
      transform: translateY(-2px);
      background: #bfdbfe;
    }

    .brand {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }

    .logo {
      width: 82px;
      height: 82px;
      object-fit: contain;
      border-radius: 50%;
      background: white;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.16);
      padding: 4px;
    }

    h1 {
      text-align: center;
      margin: 6px 0 4px;
      font-size: 1.7rem;
      color: #0f172a;
      letter-spacing: -0.5px;
    }

    .dark-mode h1 {
      color: #f8fafc;
    }

    .subtitle {
      text-align: center;
      color: #475569;
      margin-bottom: 14px;
      font-size: 0.9rem;
    }

    .dark-mode .subtitle,
    .dark-mode .info,
    .dark-mode .footer {
      color: #cbd5e1;
    }

    .dark-toggle-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }

    .layout {
      display: grid;
      grid-template-columns: 0.92fr 1.08fr;
      gap: 14px;
      align-items: start;
    }

    .panel,
    .stage {
      background: #f8fafc;
      border-radius: 20px;
      padding: 14px;
      border: 1px solid #dbeafe;
      transition: background 0.35s ease, border 0.35s ease;
    }

    .dark-mode .panel,
    .dark-mode .stage,
    .dark-mode .history,
    .dark-mode .group-card {
      background: #111827;
      border-color: #334155;
    }

    .panel-title {
      font-weight: bold;
      color: #075985;
      margin-bottom: 10px;
    }

    .dark-mode .panel-title,
    .dark-mode .group-card h3 {
      color: #f8fafc;
    }

    .list-tools {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 2px solid #bae6fd;
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 1rem;
      outline: none;
      background: white;
      color: #0f172a;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #0ea5e9;
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
    }

    textarea {
      min-height: 145px;
      resize: vertical;
    }

    .mini-buttons,
    .option-grid,
    .bottom-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.12);
    }

    button:active {
      transform: scale(0.98);
    }

    .primary {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      font-size: 1.08rem;
      padding: 15px 18px;
      margin-top: 12px;
    }

    .secondary {
      background: #e0f2fe;
      color: #075985;
    }

    .danger {
      background: #fee2e2;
      color: #991b1b;
    }

    .stage {
      background: linear-gradient(180deg, #ffffff, #f0f9ff);
    }

    .dark-mode .stage {
      background: linear-gradient(180deg, #111827, #0f172a);
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .result-header h2 {
      margin: 0;
      font-size: 1.2rem;
      color: #075985;
    }

    .dark-mode .result-header h2 {
      color: #f8fafc;
    }

    .info-pill {
      background: #e0f2fe;
      color: #075985;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 900;
    }

    .groups-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
    }

    .group-card {
      background: #f8fafc;
      border: 1px solid #dbeafe;
      border-radius: 18px;
      padding: 14px;
      min-height: 120px;
      animation: groupPop 0.4s ease both;
    }

    @keyframes groupPop {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .group-card h3 {
      margin: 0 0 10px;
      color: #0f172a;
      font-size: 1rem;
    }

    .group-card ul {
      margin: 0;
      padding-left: 20px;
      color: #334155;
      line-height: 1.55;
    }

    .dark-mode .group-card ul {
      color: #cbd5e1;
    }

    .empty-state {
      border: 2px dashed #38bdf8;
      border-radius: 18px;
      padding: 32px 18px;
      text-align: center;
      background: #ecfeff;
      color: #475569;
      font-weight: 700;
    }

    .dark-mode .empty-state {
      background: #082f49;
      color: #cbd5e1;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      color: #64748b;
      font-size: 0.85rem;
    }

    @media (max-width: 760px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .option-grid,
      .mini-buttons,
      .bottom-buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <a class="home-button" href="../">⬅ Volver al menú</a>

    <div class="content">
      <div class="brand">
        <img class="logo" src="./logo.png" alt="Logo Miguel Iglesias" />
      </div>

      <h1>Creador de grupos</h1>
      <p class="subtitle">Crea grupos aleatorios para actividades colaborativas, estaciones, proyectos y debates.</p>

      <div class="dark-toggle-wrap">
        <button class="secondary" id="darkModeBtn" style="padding:8px 14px;font-size:0.85rem;">🌙 Modo oscuro</button>
      </div>

      <section class="layout">
        <div class="panel">
          <div class="panel-title">Listas guardadas</div>

          <div class="list-tools">
            <input id="listNameInput" type="text" placeholder="Nombre de la lista: Spanish 1/2 Period 2" />

            <select id="savedListsSelect">
              <option value="">Seleccionar una lista guardada...</option>
            </select>

            <div class="mini-buttons">
              <button class="secondary" id="saveNamedListBtn">💾 Guardar lista</button>
              <button class="danger" id="deleteNamedListBtn">🗑️ Borrar lista</button>
            </div>
          </div>

          <div class="panel-title">Estudiantes</div>
          <textarea id="studentInput" placeholder="Ejemplo:\nAna García\nCarlos López\nMaría Pérez\nJuan Torres"></textarea>

          <div class="panel-title" style="margin-top:14px;">Configuración de grupos</div>

          <div class="option-grid">
            <div>
              <label class="panel-title" for="modeSelect" style="font-size:0.86rem;display:block;">Modo</label>
              <select id="modeSelect">
                <option value="number">Número de grupos</option>
                <option value="size">Tamaño por grupo</option>
              </select>
            </div>

            <div>
              <label class="panel-title" for="groupValue" style="font-size:0.86rem;display:block;">Cantidad</label>
              <input id="groupValue" type="number" min="1" value="4" />
            </div>
          </div>

          <button class="primary" id="createGroupsBtn">👥 Crear grupos</button>

          <div class="bottom-buttons">
            <button class="secondary" id="shuffleAgainBtn">🔀 Mezclar otra vez</button>
            <button class="danger" id="clearCurrentBtn">🗑️ Borrar pantalla</button>
          </div>
        </div>

        <div class="stage">
          <div class="result-header">
            <h2>Grupos generados</h2>
            <span class="info-pill" id="groupSummary">0 estudiantes</span>
          </div>

          <div id="groupsContainer" class="groups-container">
            <div class="empty-state">
              Añade estudiantes y pulsa “Crear grupos”.
            </div>
          </div>
        </div>
      </section>

      <div class="footer">Creado para clase por Miguel Iglesias</div>
    </div>
  </main>

  <script>
    let students = [];
    let savedClassLists = {};
    let lastGroups = [];
    let audioCtx = null;

    const input = document.getElementById('studentInput');
    const listNameInput = document.getElementById('listNameInput');
    const savedListsSelect = document.getElementById('savedListsSelect');
    const modeSelect = document.getElementById('modeSelect');
    const groupValue = document.getElementById('groupValue');
    const groupsContainer = document.getElementById('groupsContainer');
    const groupSummary = document.getElementById('groupSummary');
    const darkModeBtn = document.getElementById('darkModeBtn');

    document.addEventListener('DOMContentLoaded', initApp);

    function initApp() {
      savedClassLists = safeLoad('groupMakerSavedClassLists', {});
      students = safeLoad('groupMakerStudents', []);
      lastGroups = safeLoad('groupMakerLastGroups', []);

      if (students.length > 0) {
        input.value = students.join('\n');
      }

      document.getElementById('saveNamedListBtn').addEventListener('click', saveNamedList);
      document.getElementById('deleteNamedListBtn').addEventListener('click', deleteNamedList);
      savedListsSelect.addEventListener('change', loadSelectedList);
      document.getElementById('createGroupsBtn').addEventListener('click', createGroups);
      document.getElementById('shuffleAgainBtn').addEventListener('click', createGroups);
      document.getElementById('clearCurrentBtn').addEventListener('click', clearCurrentScreen);
      darkModeBtn.addEventListener('click', toggleDarkMode);

      if (safeLoad('darkMode', false)) {
        document.body.classList.add('dark-mode');
        darkModeBtn.textContent = '☀️ Modo claro';
      }

      updateSavedListsSelect();
      if (lastGroups.length > 0) {
        renderGroups(lastGroups);
      } else {
        updateSummary();
      }
    }

    function safeLoad(key, fallback) {
      try {
        return JSON.parse(localStorage.getItem(key)) || fallback;
      } catch (error) {
        return fallback;
      }
    }

    function safeSave(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function getNamesFromTextarea() {
      return input.value
        .split('\n')
        .map(name => name.trim())
        .filter(name => name.length > 0)
        .filter((name, index, arr) => arr.indexOf(name) === index);
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      darkModeBtn.textContent = isDark ? '☀️ Modo claro' : '🌙 Modo oscuro';
      safeSave('darkMode', isDark);
    }

    function saveNamedList() {
      const listName = listNameInput.value.trim();
      const names = getNamesFromTextarea();

      if (!listName) {
        showMessage('Pon nombre a la lista');
        return;
      }

      if (names.length === 0) {
        showMessage('Añade estudiantes');
        return;
      }

      savedClassLists[listName] = names;
      safeSave('groupMakerSavedClassLists', savedClassLists);
      students = names;
      safeSave('groupMakerStudents', students);
      updateSavedListsSelect(listName);
      showMessage('Lista guardada');
      updateSummary();
    }

    function loadSelectedList() {
      const listName = savedListsSelect.value;
      if (!listName || !savedClassLists[listName]) return;

      listNameInput.value = listName;
      students = [...savedClassLists[listName]];
      input.value = students.join('\n');
      lastGroups = [];
      safeSave('groupMakerStudents', students);
      safeSave('groupMakerLastGroups', lastGroups);
      renderEmptyState('Lista cargada. Pulsa “Crear grupos”.');
      updateSummary();
    }

    function deleteNamedList() {
      const listName = savedListsSelect.value || listNameInput.value.trim();
      if (!listName || !savedClassLists[listName]) {
        showMessage('Elige una lista');
        return;
      }

      delete savedClassLists[listName];
      safeSave('groupMakerSavedClassLists', savedClassLists);
      updateSavedListsSelect();
      listNameInput.value = '';
      showMessage('Lista borrada');
    }

    function updateSavedListsSelect(selectedName = '') {
      savedListsSelect.innerHTML = '<option value="">Seleccionar una lista guardada...</option>';

      Object.keys(savedClassLists).sort().forEach(name => {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        savedListsSelect.appendChild(option);
      });

      if (selectedName) {
        savedListsSelect.value = selectedName;
      }
    }

    function createGroups() {
      students = getNamesFromTextarea();

      if (students.length < 2) {
        renderEmptyState('Añade al menos dos estudiantes.');
        updateSummary();
        return;
      }

      const value = parseInt(groupValue.value, 10);
      if (!value || value < 1) {
        renderEmptyState('Introduce una cantidad válida.');
        return;
      }

      const shuffled = shuffleArray([...students]);
      let groups = [];

      if (modeSelect.value === 'number') {
        const numberOfGroups = Math.min(value, shuffled.length);
        groups = Array.from({ length: numberOfGroups }, () => []);

        shuffled.forEach((student, index) => {
          groups[index % numberOfGroups].push(student);
        });
      } else {
        const groupSize = value;
        for (let i = 0; i < shuffled.length; i += groupSize) {
          groups.push(shuffled.slice(i, i + groupSize));
        }
      }

      lastGroups = groups;
      safeSave('groupMakerStudents', students);
      safeSave('groupMakerLastGroups', lastGroups);
      renderGroups(groups);
      playSuccessSound();
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function renderGroups(groups) {
      groupsContainer.innerHTML = '';

      groups.forEach((group, index) => {
        const card = document.createElement('article');
        card.className = 'group-card';
        card.style.animationDelay = `${index * 0.04}s`;

        const title = document.createElement('h3');
        title.textContent = `Grupo ${index + 1}`;

        const list = document.createElement('ul');
        group.forEach(student => {
          const item = document.createElement('li');
          item.textContent = student;
          list.appendChild(item);
        });

        card.appendChild(title);
        card.appendChild(list);
        groupsContainer.appendChild(card);
      });

      updateSummary(groups);
    }

    function renderEmptyState(message) {
      groupsContainer.innerHTML = `<div class="empty-state">${message}</div>`;
    }

    function updateSummary(groups = lastGroups) {
      const names = getNamesFromTextarea();
      const totalStudents = names.length || students.length;
      const totalGroups = groups.length || 0;

      if (totalGroups > 0) {
        groupSummary.textContent = `${totalStudents} estudiantes · ${totalGroups} grupos`;
      } else {
        groupSummary.textContent = `${totalStudents} estudiantes`;
      }
    }

    function clearCurrentScreen() {
      students = [];
      lastGroups = [];
      input.value = '';
      listNameInput.value = '';
      savedListsSelect.value = '';
      localStorage.removeItem('groupMakerStudents');
      localStorage.removeItem('groupMakerLastGroups');
      renderEmptyState('Añade estudiantes y pulsa “Crear grupos”.');
      updateSummary();
    }

    function showMessage(message) {
      renderEmptyState(message);
      updateSummary();
    }

    function getAudioContext() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return null;

      if (!audioCtx || audioCtx.state === 'closed') {
        audioCtx = new AudioContext();
      }

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      return audioCtx;
    }

    function playTone(frequency, duration = 0.1, type = 'sine', volume = 0.06, delay = 0) {
      const ctx = getAudioContext();
      if (!ctx) return;

      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      const start = ctx.currentTime + delay;

      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, start);
      gain.gain.setValueAtTime(volume, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + duration);

      oscillator.connect(gain);
      gain.connect(ctx.destination);
      oscillator.start(start);
      oscillator.stop(start + duration + 0.02);
    }

    function playSuccessSound() {
      [523.25, 659.25, 783.99].forEach((freq, index) => {
        playTone(freq, 0.16, 'sine', 0.075, index * 0.1);
      });
    }
  </script>
</body>
</html>
